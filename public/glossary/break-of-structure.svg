<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-labelledby="t">
  <title id="t">Break of structure in an uptrend: a candle closes above the most recent swing high, confirming the trend is continuing</title>
  <rect width="720" height="400" rx="24" fill="#0A0A0B"/>
  <text x="32" y="48" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="18" fill="#F6BA18" letter-spacing="1">BREAK OF STRUCTURE (BOS)</text>
  <text x="32" y="76" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="15" fill="#A1A1A6">A close beyond the last swing high, with the trend</text>
  <line x1="330" y1="170" x2="690" y2="170" stroke="#F6BA18" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="690" y="160" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="14" fill="#F6BA18" text-anchor="end">last swing high</text>
  <polyline points="40,350 150,240 220,300 330,170 400,250 520,150 600,110" fill="none" stroke="#F5F5F7" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  <g fill="#F6BA18">
    <circle cx="150" cy="240" r="6"/><circle cx="220" cy="300" r="6"/>
    <circle cx="330" cy="170" r="6"/><circle cx="400" cy="250" r="6"/>
  </g>
  <g font-family="IBM Plex Mono, ui-monospace, monospace" font-size="17" fill="#F5F5F7" text-anchor="middle">
    <text x="150" y="224">H</text>
    <text x="220" y="328">HL</text>
    <text x="330" y="154">HH</text>
    <text x="400" y="278">HL</text>
  </g>
  <line x1="510" y1="140" x2="510" y2="200" stroke="#F5F5F7" stroke-width="2"/>
  <rect x="499" y="148" width="22" height="42" rx="2" fill="#F5F5F7"/>
  <text x="560" y="230" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="16" fill="#F5F5F7">BOS: body closes</text>
  <text x="560" y="252" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="16" fill="#F5F5F7">above the line</text>
  <text x="32" y="384" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13" fill="#6E6E73">Illustration, not real prices. In a downtrend: a close below the last swing low.</text>
</svg>
