<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-labelledby="t">
  <title id="t">Bearish breaker block: a bullish order block that held once, failed after price swept an earlier high, and is retested from below as a sell zone</title>
  <rect width="720" height="400" rx="24" fill="#0A0A0B"/>
  <text x="32" y="48" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="18" fill="#F6BA18" letter-spacing="1">BREAKER BLOCK</text>
  <text x="32" y="76" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="15" fill="#A1A1A6">A failed order block, retested from the other side</text>
  <line x1="60" y1="130" x2="420" y2="130" stroke="#6E6E73" stroke-width="1.5" stroke-dasharray="6 6"/>
  <rect x="150" y="220" width="530" height="34" fill="#F6BA18" fill-opacity="0.16"/>
  <line x1="150" y1="220" x2="680" y2="220" stroke="#F6BA18" stroke-width="2"/>
  <line x1="150" y1="254" x2="680" y2="254" stroke="#F6BA18" stroke-width="2"/>
  <polyline points="50,250 110,130 160,240 230,170 330,112 400,200 470,290 560,232 640,330" fill="none" stroke="#F5F5F7" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="330" cy="112" r="6" fill="#F6BA18"/>
  <circle cx="470" cy="290" r="6" fill="#F6BA18"/>
  <circle cx="560" cy="232" r="6" fill="#F6BA18"/>
  <g font-family="IBM Plex Mono, ui-monospace, monospace" font-size="14" fill="#F5F5F7">
    <text x="60" y="122">previous high</text>
    <text x="300" y="100">1. sweep</text>
    <text x="400" y="320">2. close below the block</text>
    <text x="520" y="210">3. retest: sell zone</text>
    <text x="160" y="276">bullish OB → bearish breaker</text>
  </g>
  <text x="32" y="384" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13" fill="#6E6E73">Illustration. A close back above the zone ends the idea.</text>
</svg>
