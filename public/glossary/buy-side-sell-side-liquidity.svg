<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-labelledby="t">
  <title id="t">Buy-side and sell-side liquidity: buy-side pools above price at a prior high and equal highs; sell-side pools below price at a swing low and the previous day's low</title>
  <rect width="720" height="400" rx="24" fill="#0A0A0B"/>
  <text x="32" y="48" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="18" fill="#F6BA18" letter-spacing="1">BUY-SIDE / SELL-SIDE</text>
  <text x="32" y="76" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="15" fill="#A1A1A6">Map the pools above and below price</text>
  <rect x="40" y="96" width="640" height="22" rx="6" fill="#F6BA18" fill-opacity="0.16"/>
  <rect x="40" y="136" width="640" height="22" rx="6" fill="#F6BA18" fill-opacity="0.10"/>
  <rect x="40" y="276" width="640" height="22" rx="6" fill="#F6BA18" fill-opacity="0.10"/>
  <rect x="40" y="316" width="640" height="22" rx="6" fill="#F6BA18" fill-opacity="0.16"/>
  <polyline points="50,250 110,120 170,230 230,120 290,274 360,160 420,240 480,205" fill="none" stroke="#F5F5F7" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="480" cy="205" r="7" fill="#F6BA18"/>
  <line x1="490" y1="205" x2="680" y2="205" stroke="#6E6E73" stroke-width="1.5" stroke-dasharray="4 6"/>
  <g font-family="IBM Plex Mono, ui-monospace, monospace" font-size="14" fill="#F5F5F7">
    <text x="420" y="112">BSL · equal highs</text>
    <text x="420" y="152">BSL · prior high</text>
    <text x="520" y="198">price now</text>
    <text x="420" y="292">SSL · swing low</text>
    <text x="420" y="332">SSL · previous day low</text>
  </g>
  <text x="32" y="384" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13" fill="#6E6E73">Illustration. Buy stops rest above price, sell stops below it.</text>
</svg>
