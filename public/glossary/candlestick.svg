<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-labelledby="t">
  <title id="t">The parts of a candle, and four 1-hour EUR/USD candles combining into one 4-hour candle: open 1.08500, high 1.08710, low 1.08380, close 1.08530</title>
  <rect width="720" height="400" rx="24" fill="#0A0A0B"/>
  <text x="32" y="48" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="18" fill="#F6BA18" letter-spacing="1">CANDLESTICK / OHLC</text>
  <text x="32" y="76" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="15" fill="#A1A1A6">Four prices per candle. Not the order they came in.</text>
  <g stroke="#F5F5F7" stroke-width="2">
    <line x1="100" y1="120" x2="100" y2="320"/>
    <rect x="84" y="170" width="32" height="100" fill="#F5F5F7"/>
  </g>
  <g font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13" fill="#A1A1A6">
    <text x="128" y="124">High</text>
    <text x="128" y="148">upper wick</text>
    <text x="128" y="174">Close</text>
    <text x="128" y="224" fill="#F5F5F7">Body</text>
    <text x="128" y="274">Open</text>
    <text x="128" y="300">lower wick</text>
    <text x="128" y="324">Low</text>
  </g>
  <line x1="290" y1="110" x2="290" y2="340" stroke="#2A2A2E" stroke-width="1"/>
  <g fill="#F5F5F7" stroke="#F5F5F7" stroke-width="1.5">
<line x1="330" y1="177.3" x2="330" y2="279.1"/><rect x="320" y="196.4" width="20" height="57.19999999999999" fill="#F5F5F7"/>
<line x1="370" y1="120.0" x2="370" y2="221.8"/><rect x="360" y="139.1" width="20" height="57.30000000000001" fill="#F5F5F7"/>
<line x1="410" y1="126.4" x2="410" y2="304.5"/><rect x="400" y="139.1" width="20" height="146.4" fill="#141416"/>
<line x1="450" y1="215.5" x2="450" y2="330.0"/><rect x="440" y="234.5" width="20" height="51.0" fill="#F5F5F7"/>
<line x1="560" y1="120.0" x2="560" y2="330.0" stroke="#F6BA18"/><rect x="546" y="234.5" width="28" height="19.099999999999994" fill="#F6BA18" stroke="#F6BA18"/>
  </g>
  <text x="497" y="232" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="18" fill="#A1A1A6">=</text>
  <g font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13">
    <text x="586" y="124" fill="#F5F5F7">H 1.08710</text>
    <text x="586" y="238" fill="#F6BA18">C 1.08530</text>
    <text x="586" y="258" fill="#F6BA18">O 1.08500</text>
    <text x="586" y="334" fill="#F5F5F7">L 1.08380</text>
    <text x="312" y="360" fill="#A1A1A6">Four 1H candles</text>
    <text x="520" y="360" fill="#A1A1A6">One 4H candle</text>
  </g>
  <text x="32" y="384" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13" fill="#6E6E73">Illustration. EUR/USD prices are examples, not real data.</text>
</svg>
