<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-labelledby="t">
  <title id="t">Change of character: an uptrend of higher highs and higher lows, then a candle closes below the last higher low, the first break against the trend</title>
  <rect width="720" height="400" rx="24" fill="#0A0A0B"/>
  <text x="32" y="48" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="18" fill="#F6BA18" letter-spacing="1">CHANGE OF CHARACTER (CHoCH)</text>
  <text x="32" y="76" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="15" fill="#A1A1A6">The first close against the trend</text>
  <line x1="380" y1="230" x2="690" y2="230" stroke="#F6BA18" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="400" y="254" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="14" fill="#F6BA18">last higher low</text>
  <polyline points="40,330 140,210 210,270 310,160 380,230 470,120 630,320" fill="none" stroke="#F5F5F7" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  <g fill="#F6BA18">
    <circle cx="140" cy="210" r="6"/><circle cx="210" cy="270" r="6"/>
    <circle cx="310" cy="160" r="6"/><circle cx="380" cy="230" r="6"/>
    <circle cx="470" cy="120" r="6"/>
  </g>
  <g font-family="IBM Plex Mono, ui-monospace, monospace" font-size="17" fill="#F5F5F7" text-anchor="middle">
    <text x="140" y="194">H</text>
    <text x="210" y="298">HL</text>
    <text x="310" y="144">HH</text>
    <text x="380" y="258">HL</text>
    <text x="470" y="104">HH</text>
  </g>
  <line x1="580" y1="212" x2="580" y2="290" stroke="#F5F5F7" stroke-width="2"/>
  <rect x="569" y="220" width="22" height="50" rx="2" fill="none" stroke="#F5F5F7" stroke-width="2"/>
  <text x="430" y="330" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="16" fill="#F5F5F7" text-anchor="end">CHoCH: body closes</text>
  <text x="430" y="352" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="16" fill="#F5F5F7" text-anchor="end">below the last HL</text>
  <text x="32" y="384" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13" fill="#6E6E73">Illustration, not real prices. In a downtrend: a close above the last lower high.</text>
</svg>
