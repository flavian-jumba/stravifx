<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-labelledby="t">
  <title id="t">Confluence on a buy: price falls into the discount half of the range, sweeps an earlier low and reaches an order block, so three different reasons meet at one area before price turns up</title>
  <rect width="720" height="400" rx="24" fill="#0A0A0B"/>
  <text x="32" y="48" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="18" fill="#F6BA18" letter-spacing="1">CONFLUENCE</text>
  <text x="32" y="76" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="15" fill="#A1A1A6">Different kinds of reason at one price</text>
  <line x1="60" y1="110" x2="690" y2="110" stroke="#6E6E73" stroke-width="1.5"/>
  <line x1="60" y1="210" x2="690" y2="210" stroke="#6E6E73" stroke-width="1.5" stroke-dasharray="6 6"/>
  <rect x="60" y="210" width="630" height="130" fill="#F5F5F7" fill-opacity="0.04"/>
  <rect x="300" y="276" width="390" height="26" fill="#F6BA18" fill-opacity="0.18" stroke="#F6BA18" stroke-width="1.5"/>
  <line x1="150" y1="300" x2="420" y2="300" stroke="#A1A1A6" stroke-width="1.5" stroke-dasharray="3 5"/>
  <polyline points="70,320 150,300 230,110 290,200 340,240 390,230 430,314 470,282 540,200 610,140" fill="none" stroke="#F5F5F7" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="150" cy="300" r="6" fill="#F5F5F7"/>
  <circle cx="430" cy="314" r="7" fill="#F6BA18"/>
  <g font-family="IBM Plex Mono, ui-monospace, monospace" font-size="14" fill="#F5F5F7">
    <text x="600" y="102">high</text>
    <text x="640" y="202" fill="#A1A1A6">50%</text>
    <text x="590" y="250" fill="#A1A1A6">discount</text>
    <text x="560" y="294">order block</text>
    <text x="400" y="338">sweep of the low</text>
    <text x="80" y="345" fill="#A1A1A6">earlier low</text>
  </g>
  <text x="32" y="384" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13" fill="#6E6E73">Illustration. Agreement narrows the trades; it guarantees none.</text>
</svg>
