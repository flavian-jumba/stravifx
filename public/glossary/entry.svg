<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-labelledby="t">
  <title id="t">Three ways to enter the same buy: a stop entry above the recent high, a market entry at the current price and a limit entry down at the support level, all sharing one stop loss and one target</title>
  <rect width="720" height="400" rx="24" fill="#0A0A0B"/>
  <text x="32" y="48" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="18" fill="#F6BA18" letter-spacing="1">ENTRY</text>
  <text x="32" y="76" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="15" fill="#A1A1A6">Same stop, same target: the entry sets the risk</text>
  <line x1="80" y1="100" x2="690" y2="100" stroke="#6E6E73" stroke-width="1.5"/>
  <line x1="80" y1="320" x2="690" y2="320" stroke="#A1A1A6" stroke-width="1.5" stroke-dasharray="8 6"/>
  <rect x="80" y="250" width="320" height="22" fill="#F5F5F7" fill-opacity="0.06"/>
  <polyline points="60,290 130,252 180,276 260,140 320,196 380,176" fill="none" stroke="#F5F5F7" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="380" cy="176" r="6" fill="#F5F5F7"/>
  <line x1="430" y1="134" x2="470" y2="134" stroke="#F6BA18" stroke-width="3"/>
  <line x1="430" y1="176" x2="470" y2="176" stroke="#F6BA18" stroke-width="3"/>
  <line x1="430" y1="258" x2="470" y2="258" stroke="#F6BA18" stroke-width="3"/>
  <g font-family="IBM Plex Mono, ui-monospace, monospace" font-size="14" fill="#F5F5F7">
    <text x="96" y="94">target</text>
    <text x="478" y="139">stop entry: buys the break</text>
    <text x="478" y="181">market entry: buys now</text>
    <text x="478" y="263">limit entry: waits</text>
    <text x="96" y="244">support</text>
    <text x="96" y="340">stop loss (shared)</text>
  </g>
  <text x="32" y="384" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13" fill="#6E6E73">Illustration. Lower entry: smaller risk, but it may never fill.</text>
</svg>
