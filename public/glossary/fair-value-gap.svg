<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-labelledby="t">
  <title id="t">Bullish fair value gap: three candles where the first candle's high and the third candle's low do not overlap, leaving a gap with a 50% midpoint line</title>
  <rect width="720" height="400" rx="24" fill="#0A0A0B"/>
  <text x="32" y="48" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="18" fill="#F6BA18" letter-spacing="1">FAIR VALUE GAP</text>
  <text x="32" y="76" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="15" fill="#A1A1A6">Candle 1's high and candle 3's low don't overlap</text>
  <rect x="150" y="170" width="420" height="80" fill="#F6BA18" fill-opacity="0.16"/>
  <line x1="150" y1="170" x2="570" y2="170" stroke="#F6BA18" stroke-width="2"/>
  <line x1="150" y1="250" x2="570" y2="250" stroke="#F6BA18" stroke-width="2"/>
  <line x1="150" y1="210" x2="570" y2="210" stroke="#F6BA18" stroke-width="1.5" stroke-dasharray="6 6"/>
  <g stroke="#F5F5F7" stroke-width="2">
    <line x1="200" y1="250" x2="200" y2="320"/><rect x="190" y="262" width="20" height="40" rx="2" fill="none"/>
    <line x1="300" y1="110" x2="300" y2="300"/><rect x="290" y="120" width="20" height="170" rx="2" fill="none"/>
    <line x1="400" y1="100" x2="400" y2="170"/><rect x="390" y="110" width="20" height="40" rx="2" fill="none"/>
  </g>
  <g font-family="IBM Plex Mono, ui-monospace, monospace" font-size="14" fill="#F5F5F7">
    <text x="186" y="344">1</text>
    <text x="286" y="324">2</text>
    <text x="386" y="94">3</text>
    <text x="440" y="164">candle 3 low (top)</text>
    <text x="440" y="270">candle 1 high (bottom)</text>
    <text x="590" y="215">50%</text>
    <text x="430" y="206" fill="#F6BA18">bullish FVG</text>
  </g>
  <text x="32" y="384" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13" fill="#6E6E73">Illustration. Measure from the wicks; if they touch, there is no gap.</text>
</svg>
