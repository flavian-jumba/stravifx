<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-labelledby="t">
  <title id="t">Higher highs and higher lows: swings labelled L, H, HL, HH, HL, then a lower high and a lower low as the uptrend ends</title>
  <rect width="720" height="400" rx="24" fill="#0A0A0B"/>
  <text x="32" y="48" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="18" fill="#F6BA18" letter-spacing="1">HIGHER HIGHS / HIGHER LOWS</text>
  <text x="32" y="76" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="15" fill="#A1A1A6">Label each swing against the last one of its kind</text>
  <polyline points="50,322 150,174 250,257 350,119 450,192 550,128 660,229" fill="none" stroke="#F5F5F7" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  <g fill="#F6BA18">
    <circle cx="50" cy="322" r="6"/><circle cx="150" cy="174" r="6"/>
    <circle cx="250" cy="257" r="6"/><circle cx="350" cy="119" r="6"/>
    <circle cx="450" cy="192" r="6"/>
  </g>
  <g fill="none" stroke="#F6BA18" stroke-width="2.5">
    <circle cx="550" cy="128" r="6"/><circle cx="660" cy="229" r="6"/>
  </g>
  <g font-family="IBM Plex Mono, ui-monospace, monospace" font-size="17" fill="#F5F5F7" text-anchor="middle">
    <text x="80" y="338">L</text>
    <text x="150" y="158">H</text>
    <text x="250" y="285">HL</text>
    <text x="350" y="103">HH</text>
    <text x="450" y="220">HL</text>
  </g>
  <g font-family="IBM Plex Mono, ui-monospace, monospace" font-size="17" fill="#F6BA18" text-anchor="middle">
    <text x="550" y="112">LH</text>
    <text x="660" y="257">LL</text>
  </g>
  <g font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12" fill="#A1A1A6" text-anchor="middle">
    <text x="50" y="306">1.0800</text>
    <text x="150" y="196">1.0880</text>
    <text x="250" y="304">1.0835</text>
    <text x="350" y="141">1.0910</text>
    <text x="450" y="238">1.0870</text>
    <text x="550" y="150">1.0905</text>
    <text x="660" y="276">1.0850</text>
  </g>
  <text x="32" y="384" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13" fill="#6E6E73">Illustration, not real prices. Gold labels: the uptrend's pattern breaks.</text>
</svg>
