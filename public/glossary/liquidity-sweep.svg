<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-labelledby="t">
  <title id="t">Liquidity sweep vs breakout: two candles push below the same swing low; the left one closes back above it (a sweep), the right one closes below it (a breakout)</title>
  <rect width="720" height="400" rx="24" fill="#0A0A0B"/>
  <text x="32" y="48" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="18" fill="#F6BA18" letter-spacing="1">LIQUIDITY SWEEP</text>
  <text x="32" y="76" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="15" fill="#A1A1A6">Same push, different close</text>
  <line x1="360" y1="100" x2="360" y2="350" stroke="#2C2C2E" stroke-width="2"/>
  <line x1="40" y1="250" x2="340" y2="250" stroke="#F6BA18" stroke-width="2" stroke-dasharray="8 6"/>
  <line x1="380" y1="250" x2="680" y2="250" stroke="#F6BA18" stroke-width="2" stroke-dasharray="8 6"/>
  <rect x="40" y="252" width="300" height="24" rx="6" fill="#F6BA18" fill-opacity="0.16"/>
  <rect x="380" y="252" width="300" height="24" rx="6" fill="#F6BA18" fill-opacity="0.16"/>
  <polyline points="50,200 110,130 170,250 220,170" fill="none" stroke="#F5F5F7" stroke-width="3" stroke-linejoin="round"/>
  <polyline points="390,200 450,130 510,250 560,170" fill="none" stroke="#F5F5F7" stroke-width="3" stroke-linejoin="round"/>
  <g stroke="#F5F5F7" stroke-width="2" fill="none">
    <line x1="270" y1="150" x2="270" y2="300"/><rect x="260" y="170" width="20" height="60" rx="2"/>
    <line x1="610" y1="160" x2="610" y2="320"/><rect x="600" y="175" width="20" height="110" rx="2" fill="#F5F5F7" fill-opacity="0.25"/>
  </g>
  <line x1="220" y1="170" x2="260" y2="175" stroke="#F5F5F7" stroke-width="3"/>
  <line x1="560" y1="170" x2="600" y2="175" stroke="#F5F5F7" stroke-width="3"/>
  <circle cx="270" cy="230" r="6" fill="#F6BA18"/>
  <circle cx="610" cy="285" r="6" fill="#F6BA18"/>
  <g font-family="IBM Plex Mono, ui-monospace, monospace" font-size="14" fill="#F5F5F7">
    <text x="50" y="112">SWEEP</text>
    <text x="390" y="112">BREAKOUT</text>
    <text x="50" y="300">sell stops below the low</text>
    <text x="150" y="330">close back above the low</text>
    <text x="440" y="340">close below the low</text>
  </g>
  <text x="32" y="384" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13" fill="#6E6E73">Illustration. Both wicks take the stops; only the close tells you which it was.</text>
</svg>
