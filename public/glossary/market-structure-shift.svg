<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-labelledby="t">
  <title id="t">Market structure shift: an uptrend breaks its last higher low (CHoCH), the next rally fails as a lower high, then a close below the low in between confirms bearish structure (MSS)</title>
  <rect width="720" height="400" rx="24" fill="#0A0A0B"/>
  <text x="32" y="48" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="18" fill="#F6BA18" letter-spacing="1">MARKET STRUCTURE SHIFT (MSS)</text>
  <text x="32" y="76" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="15" fill="#A1A1A6">CHoCH, a failed rally, then a close below the low</text>
  <line x1="320" y1="220" x2="480" y2="220" stroke="#A1A1A6" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="460" y1="270" x2="690" y2="270" stroke="#F6BA18" stroke-width="2" stroke-dasharray="8 6"/>
  <polyline points="40,330 110,220 170,270 260,150 320,220 400,110 460,270 530,170 670,340" fill="none" stroke="#F5F5F7" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  <g fill="#F6BA18">
    <circle cx="110" cy="220" r="6"/><circle cx="170" cy="270" r="6"/>
    <circle cx="260" cy="150" r="6"/><circle cx="320" cy="220" r="6"/>
    <circle cx="400" cy="110" r="6"/><circle cx="460" cy="270" r="6"/>
    <circle cx="530" cy="170" r="6"/>
  </g>
  <g font-family="IBM Plex Mono, ui-monospace, monospace" font-size="17" fill="#F5F5F7" text-anchor="middle">
    <text x="110" y="204">H</text>
    <text x="170" y="298">HL</text>
    <text x="260" y="134">HH</text>
    <text x="320" y="248">HL</text>
    <text x="400" y="94">HH</text>
    <text x="460" y="298">L</text>
    <text x="530" y="154">LH</text>
  </g>
  <circle cx="441" cy="220" r="6" fill="none" stroke="#F5F5F7" stroke-width="2"/>
  <text x="452" y="206" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="14" fill="#A1A1A6">CHoCH</text>
  <circle cx="612" cy="270" r="7" fill="none" stroke="#F6BA18" stroke-width="2.5"/>
  <text x="626" y="256" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="17" fill="#F6BA18">MSS</text>
  <text x="32" y="384" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13" fill="#6E6E73">Illustration, not real prices. A bullish MSS is the mirror image.</text>
</svg>
