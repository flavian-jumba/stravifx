<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-labelledby="t">
  <title id="t">Bearish mitigation block: a bullish order block whose rally fails to reach the previous high, then price closes below the block and retests it from below as a sell zone</title>
  <rect width="720" height="400" rx="24" fill="#0A0A0B"/>
  <text x="32" y="48" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="18" fill="#F6BA18" letter-spacing="1">MITIGATION BLOCK</text>
  <text x="32" y="76" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="15" fill="#A1A1A6">A failed swing, a break, a retest from the other side</text>
  <line x1="60" y1="120" x2="420" y2="120" stroke="#6E6E73" stroke-width="1.5" stroke-dasharray="6 6"/>
  <rect x="150" y="220" width="530" height="34" fill="#F6BA18" fill-opacity="0.16"/>
  <line x1="150" y1="220" x2="680" y2="220" stroke="#F6BA18" stroke-width="2"/>
  <line x1="150" y1="254" x2="680" y2="254" stroke="#F6BA18" stroke-width="2"/>
  <polyline points="50,250 110,120 160,240 260,160 330,205 400,292 480,232 570,330" fill="none" stroke="#F5F5F7" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="260" cy="160" r="6" fill="#F6BA18"/>
  <circle cx="400" cy="292" r="6" fill="#F6BA18"/>
  <circle cx="480" cy="232" r="6" fill="#F6BA18"/>
  <g font-family="IBM Plex Mono, ui-monospace, monospace" font-size="14" fill="#F5F5F7">
    <text x="60" y="110">previous high</text>
    <text x="214" y="148">1. lower high, no sweep</text>
    <text x="330" y="322">2. close below the block</text>
    <text x="460" y="208">3. retest: sell zone</text>
    <text x="160" y="276">OB → mitigation block</text>
  </g>
  <text x="32" y="384" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13" fill="#6E6E73">Illustration. A close back above the zone ends the idea.</text>
</svg>
