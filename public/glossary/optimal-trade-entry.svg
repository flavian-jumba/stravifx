<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-labelledby="t">
  <title id="t">Optimal trade entry: a bullish leg from a swing low to a swing high, with the 62% to 79% retracement band shaded, price pulling back to about 70.5% and the stop below the swing low</title>
  <rect width="720" height="400" rx="24" fill="#0A0A0B"/>
  <text x="32" y="48" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="18" fill="#F6BA18" letter-spacing="1">OPTIMAL TRADE ENTRY (OTE)</text>
  <text x="32" y="76" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="15" fill="#A1A1A6">The 62–79% pullback of the last impulse leg</text>
  <rect x="80" y="243" width="610" height="39" fill="#F6BA18" fill-opacity="0.16"/>
  <line x1="80" y1="100" x2="690" y2="100" stroke="#6E6E73" stroke-width="1.5"/>
  <line x1="80" y1="330" x2="690" y2="330" stroke="#6E6E73" stroke-width="1.5"/>
  <line x1="80" y1="243" x2="690" y2="243" stroke="#F6BA18" stroke-width="1.5"/>
  <line x1="80" y1="262" x2="690" y2="262" stroke="#F6BA18" stroke-width="1.5" stroke-dasharray="4 6"/>
  <line x1="80" y1="282" x2="690" y2="282" stroke="#F6BA18" stroke-width="1.5"/>
  <line x1="80" y1="350" x2="690" y2="350" stroke="#A1A1A6" stroke-width="1.5" stroke-dasharray="8 6"/>
  <polyline points="60,300 90,330 150,262 190,288 300,140 340,170 390,100 450,190 500,215 560,262 620,200 670,120" fill="none" stroke="#F5F5F7" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="90" cy="330" r="6" fill="#F6BA18"/>
  <circle cx="390" cy="100" r="6" fill="#F6BA18"/>
  <circle cx="560" cy="262" r="7" fill="#F6BA18"/>
  <g font-family="IBM Plex Mono, ui-monospace, monospace" font-size="14" fill="#F5F5F7">
    <text x="404" y="94">swing high (0%)</text>
    <text x="180" y="322">swing low (100%)</text>
    <text x="596" y="268">OTE 62–79%</text>
    <text x="436" y="304">entry near 70.5%</text>
    <text x="106" y="370">stop: below the swing low</text>
  </g>
  <text x="32" y="390" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13" fill="#6E6E73">Illustration, not real prices.</text>
</svg>
