<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-labelledby="t">
  <title id="t">Bullish order block: the last down candle before a strong up move that breaks the last swing high, with the entry at the top of its body and the stop below its wick</title>
  <rect width="720" height="400" rx="24" fill="#0A0A0B"/>
  <text x="32" y="48" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="18" fill="#F6BA18" letter-spacing="1">ORDER BLOCK</text>
  <text x="32" y="76" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="15" fill="#A1A1A6">The last down candle before the move</text>
  <line x1="40" y1="150" x2="680" y2="150" stroke="#6E6E73" stroke-width="1.5" stroke-dasharray="6 6"/>
  <text x="128" y="140" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13" fill="#A1A1A6">last swing high</text>
  <polyline points="50,230 110,150 170,250 220,262" fill="none" stroke="#F5F5F7" stroke-width="3" stroke-linejoin="round"/>
  <rect x="226" y="262" width="440" height="38" fill="#F6BA18" fill-opacity="0.14"/>
  <g stroke="#F5F5F7" stroke-width="2">
    <line x1="240" y1="250" x2="240" y2="300"/><rect x="230" y="262" width="20" height="22" rx="2" fill="#F5F5F7" fill-opacity="0.25"/>
    <line x1="280" y1="270" x2="280" y2="105"/><rect x="270" y="115" width="20" height="150" rx="2" fill="none"/>
  </g>
  <polyline points="290,115 360,100 420,180 470,262" fill="none" stroke="#F5F5F7" stroke-width="3" stroke-linejoin="round"/>
  <polyline points="470,262 540,170 600,110" fill="none" stroke="#F5F5F7" stroke-width="3" stroke-linejoin="round"/>
  <rect x="226" y="246" width="28" height="56" rx="4" fill="none" stroke="#F6BA18" stroke-width="2.5"/>
  <line x1="460" y1="262" x2="680" y2="262" stroke="#F6BA18" stroke-width="2"/>
  <line x1="460" y1="312" x2="680" y2="312" stroke="#F6BA18" stroke-width="2" stroke-dasharray="8 6"/>
  <circle cx="470" cy="262" r="6" fill="#F6BA18"/>
  <g font-family="IBM Plex Mono, ui-monospace, monospace" font-size="14" fill="#F5F5F7">
    <text x="60" y="330">bullish order block</text>
    <text x="300" y="96">strong move, breaks the high</text>
    <text x="560" y="256">entry: top of body</text>
    <text x="560" y="332">stop: below wick</text>
  </g>
  <line x1="200" y1="318" x2="232" y2="300" stroke="#F6BA18" stroke-width="1.5"/>
  <text x="32" y="384" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13" fill="#6E6E73">Illustration. A close below the wick means the block has failed.</text>
</svg>
