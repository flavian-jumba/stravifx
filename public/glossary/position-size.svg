<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-labelledby="t">
  <title id="t">Position size worked out in three steps: 1% of a 2,000 dollar account is 20 dollars at risk, a 25-pip stop on EUR/USD costs 250 dollars per standard lot, so the size is 0.08 lots</title>
  <rect width="720" height="400" rx="24" fill="#0A0A0B"/>
  <text x="32" y="48" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="18" fill="#F6BA18" letter-spacing="1">POSITION SIZE</text>
  <text x="32" y="76" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="15" fill="#A1A1A6">The stop comes from the chart, the size from the money</text>
  <g fill="#141416" stroke="#6E6E73" stroke-width="1"><rect x="32" y="120" width="196" height="150" rx="16"/><rect x="262" y="120" width="196" height="150" rx="16"/></g>
  <rect x="492" y="120" width="196" height="150" rx="16" fill="#F6BA18" fill-opacity="0.12" stroke="#F6BA18" stroke-width="1.5"/>
  <g font-family="IBM Plex Mono, ui-monospace, monospace">
    <text x="48" y="150" font-size="13" fill="#A1A1A6">1 · MONEY AT RISK</text>
    <text x="48" y="200" font-size="30" fill="#F5F5F7">$20</text>
    <text x="48" y="232" font-size="13" fill="#A1A1A6">1% of $2,000</text>
    <text x="278" y="150" font-size="13" fill="#A1A1A6">2 · COST PER LOT</text>
    <text x="278" y="200" font-size="30" fill="#F5F5F7">$250</text>
    <text x="278" y="232" font-size="13" fill="#A1A1A6">25 pips × $10</text>
    <text x="508" y="150" font-size="13" fill="#F6BA18">3 · SIZE</text>
    <text x="508" y="200" font-size="30" fill="#F5F5F7">0.08 lots</text>
    <text x="508" y="232" font-size="13" fill="#A1A1A6">$20 ÷ $250</text>
    <text x="236" y="202" font-size="22" fill="#F6BA18">÷</text>
    <text x="466" y="202" font-size="22" fill="#F6BA18">=</text>
    <text x="32" y="318" font-size="14" fill="#F5F5F7">0.08 lots = 8,000 units of EUR</text>
    <text x="32" y="342" font-size="14" fill="#A1A1A6">Leverage changes the margin, not the $20.</text>
  </g>
  <text x="32" y="384" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13" fill="#6E6E73">Illustration. USD account, EUR/USD, $10 per pip per standard lot.</text>
</svg>
