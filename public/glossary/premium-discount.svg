<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-labelledby="t">
  <title id="t">Premium and discount: a bullish range from swing low to swing high, split at the 50% equilibrium line, with premium above and discount below and price pulling back into discount</title>
  <rect width="720" height="400" rx="24" fill="#0A0A0B"/>
  <text x="32" y="48" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="18" fill="#F6BA18" letter-spacing="1">PREMIUM / DISCOUNT</text>
  <text x="32" y="76" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="15" fill="#A1A1A6">Split the range at 50%: sell high, buy low</text>
  <rect x="80" y="100" width="610" height="110" fill="#F5F5F7" fill-opacity="0.05"/>
  <rect x="80" y="210" width="610" height="110" fill="#F6BA18" fill-opacity="0.14"/>
  <line x1="80" y1="100" x2="690" y2="100" stroke="#6E6E73" stroke-width="1.5"/>
  <line x1="80" y1="320" x2="690" y2="320" stroke="#6E6E73" stroke-width="1.5"/>
  <line x1="80" y1="210" x2="690" y2="210" stroke="#F6BA18" stroke-width="2" stroke-dasharray="6 6"/>
  <polyline points="60,290 90,320 160,250 200,280 300,150 330,180 380,100 460,190 520,262 600,200 660,130" fill="none" stroke="#F5F5F7" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="90" cy="320" r="6" fill="#F6BA18"/>
  <circle cx="380" cy="100" r="6" fill="#F6BA18"/>
  <circle cx="520" cy="262" r="6" fill="#F6BA18"/>
  <g font-family="IBM Plex Mono, ui-monospace, monospace" font-size="14" fill="#F5F5F7">
    <text x="96" y="94">range high</text>
    <text x="110" y="342">range low</text>
    <text x="470" y="130">premium: above 50%</text>
    <text x="96" y="202">equilibrium 50%</text>
    <text x="230" y="300">discount: below 50%</text>
    <text x="470" y="294">pullback into discount</text>
  </g>
  <text x="32" y="384" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13" fill="#6E6E73">Illustration. The range moves when price makes a new high.</text>
</svg>
