<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-labelledby="t">
  <title id="t">Range: price swings between a ceiling and a floor several times without closing beyond either, then a candle closes above the ceiling and the range ends</title>
  <rect width="720" height="400" rx="24" fill="#0A0A0B"/>
  <text x="32" y="48" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="18" fill="#F6BA18" letter-spacing="1">RANGE / CONSOLIDATION</text>
  <text x="32" y="76" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="15" fill="#A1A1A6">Edges from the wicks; a close outside ends it</text>
  <line x1="40" y1="140" x2="620" y2="140" stroke="#F6BA18" stroke-width="2" stroke-dasharray="8 6"/>
  <line x1="40" y1="290" x2="620" y2="290" stroke="#F6BA18" stroke-width="2" stroke-dasharray="8 6"/>
  <line x1="40" y1="215" x2="620" y2="215" stroke="#6E6E73" stroke-width="1.5" stroke-dasharray="4 6"/>
  <polyline points="50,270 115,142 180,286 245,146 310,289 375,141 440,284 505,148 570,282 640,104" fill="none" stroke="#F5F5F7" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="640" cy="104" r="6" fill="#F6BA18"/>
  <g font-family="IBM Plex Mono, ui-monospace, monospace" font-size="15" fill="#F5F5F7">
    <text x="40" y="128">ceiling</text>
    <text x="40" y="314">floor</text>
  </g>
  <text x="630" y="219" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13" fill="#A1A1A6">midpoint</text>
  <text x="690" y="88" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="14" fill="#F5F5F7" text-anchor="end">close above</text>
  <text x="32" y="384" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13" fill="#6E6E73">Illustration. Four touches of each edge, no close beyond either, then a break.</text>
</svg>
