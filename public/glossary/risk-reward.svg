<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-labelledby="t">
  <title id="t">Risk-to-reward on a buy: the stop is one unit of risk below the entry, and targets at one, two and three times that distance need win rates of 50%, 33% and 25% to break even</title>
  <rect width="720" height="400" rx="24" fill="#0A0A0B"/>
  <text x="32" y="48" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="18" fill="#F6BA18" letter-spacing="1">RISK-TO-REWARD</text>
  <text x="32" y="76" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="15" fill="#A1A1A6">The further the target, the fewer wins you need</text>
  <line x1="60" y1="120" x2="690" y2="120" stroke="#F6BA18" stroke-width="2"/>
  <line x1="60" y1="175" x2="690" y2="175" stroke="#F6BA18" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="60" y1="230" x2="690" y2="230" stroke="#F6BA18" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="60" y1="285" x2="690" y2="285" stroke="#F5F5F7" stroke-width="1.5"/>
  <line x1="60" y1="340" x2="690" y2="340" stroke="#6E6E73" stroke-width="2"/>
  <rect x="100" y="285" width="60" height="55" fill="#6E6E73" fill-opacity="0.35"/>
  <rect x="100" y="120" width="60" height="165" fill="#F6BA18" fill-opacity="0.16"/>
  <g font-family="IBM Plex Mono, ui-monospace, monospace" font-size="14" fill="#F5F5F7">
    <text x="190" y="114">1:3 · 3R</text><text x="420" y="114" fill="#A1A1A6">break-even 25%</text>
    <text x="190" y="169">1:2 · 2R</text><text x="420" y="169" fill="#A1A1A6">break-even 33%</text>
    <text x="190" y="224">1:1 · 1R</text><text x="420" y="224" fill="#A1A1A6">break-even 50%</text>
    <text x="190" y="279">entry</text>
    <text x="190" y="334">stop · risk = 1R</text>
  </g>
  <text x="32" y="384" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13" fill="#6E6E73">Illustration. Break-even = 1 ÷ (1 + reward ÷ risk), before costs.</text>
</svg>
