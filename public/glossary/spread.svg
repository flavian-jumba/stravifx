<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-labelledby="t">
  <title id="t">A sell on GBP/USD with a 1.5-pip spread: the bid candle peaks at 1.30190, one pip under the 1.30200 stop, but the ask is at 1.30205 and the stop is hit</title>
  <rect width="720" height="400" rx="24" fill="#0A0A0B"/>
  <text x="32" y="48" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="18" fill="#F6BA18" letter-spacing="1">SPREAD</text>
  <text x="32" y="76" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="15" fill="#A1A1A6">The chart shows the bid. A sell closes at the ask.</text>
  <line x1="40" y1="118" x2="560" y2="118" stroke="#F6BA18" stroke-width="2"/>
  <line x1="40" y1="134" x2="560" y2="134" stroke="#A1A1A6" stroke-width="1.5" stroke-dasharray="6 5"/>
  <line x1="40" y1="300" x2="560" y2="300" stroke="#6E6E73" stroke-width="1" stroke-dasharray="3 5"/>
  <line x1="40" y1="324" x2="560" y2="324" stroke="#A1A1A6" stroke-width="1"/>
  <g fill="#F5F5F7" stroke="#F5F5F7">
    <line x1="120" y1="250" x2="120" y2="318"/><rect x="110" y="262" width="20" height="38" fill="#141416"/>
    <line x1="200" y1="210" x2="200" y2="276"/><rect x="190" y="222" width="20" height="40" fill="#141416"/>
    <line x1="280" y1="138" x2="280" y2="236"/><rect x="270" y="176" width="20" height="46"/>
    <line x1="360" y1="182" x2="360" y2="262"/><rect x="350" y="192" width="20" height="54"/>
  </g>
  <line x1="280" y1="138" x2="280" y2="122" stroke="#F6BA18" stroke-width="2" stroke-dasharray="2 3"/>
  <circle cx="280" cy="121" r="5" fill="#F6BA18"/>
  <g font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13">
    <text x="572" y="122" fill="#F6BA18">Stop 1.30200</text>
    <text x="572" y="142" fill="#A1A1A6">Bid high 1.30190</text>
    <text x="572" y="304" fill="#A1A1A6">Ask 1.30015</text>
    <text x="572" y="328" fill="#F5F5F7">Sell, bid 1.30000</text>
    <text x="300" y="106" fill="#F6BA18">ask 1.30205 hits the stop</text>
    <text x="40" y="354" fill="#A1A1A6">Spread 1.5 pips. The ask runs 1.5 pips above every bid candle.</text>
  </g>
  <text x="32" y="384" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13" fill="#6E6E73">Illustration. Prices are examples, not real data. Not to scale.</text>
</svg>
