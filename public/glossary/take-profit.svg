<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-labelledby="t">
  <title id="t">Take profit on a buy: stop loss, entry, TP1 at 1.5R at the next swing high and TP2 at 2.5R at the higher swing high, with price reaching TP1, pulling back, then reaching TP2</title>
  <rect width="720" height="400" rx="24" fill="#0A0A0B"/>
  <text x="32" y="48" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="18" fill="#F6BA18" letter-spacing="1">TAKE PROFIT</text>
  <text x="32" y="76" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="15" fill="#A1A1A6">TP1 trims at the nearest level, TP2 runs to the next</text>
  <line x1="60" y1="130" x2="690" y2="130" stroke="#F6BA18" stroke-width="2"/>
  <line x1="60" y1="190" x2="690" y2="190" stroke="#F6BA18" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="60" y1="280" x2="690" y2="280" stroke="#F5F5F7" stroke-width="1.5"/>
  <line x1="60" y1="340" x2="690" y2="340" stroke="#6E6E73" stroke-width="2"/>
  <polyline points="70,250 130,300 190,280 260,230 330,190 390,240 450,205 520,160 580,130" fill="none" stroke="#F5F5F7" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="190" cy="280" r="6" fill="#F5F5F7"/>
  <circle cx="330" cy="190" r="6" fill="#F6BA18"/>
  <circle cx="580" cy="130" r="7" fill="#F6BA18"/>
  <g font-family="IBM Plex Mono, ui-monospace, monospace" font-size="14" fill="#F5F5F7">
    <text x="600" y="122">TP2 · 2.5R</text>
    <text x="600" y="182">TP1 · 1.5R</text>
    <text x="600" y="272">entry</text>
    <text x="600" y="332">stop · 1R</text>
    <text x="350" y="182" fill="#A1A1A6">trim half</text>
    <text x="440" y="122" fill="#A1A1A6">runner</text>
  </g>
  <text x="32" y="384" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13" fill="#6E6E73">Illustration. Targets sit at chart levels, not round numbers.</text>
</svg>
